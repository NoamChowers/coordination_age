name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==9.0.2
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
